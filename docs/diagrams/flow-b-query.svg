<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="Flow B — Query: an engineer @mentions the bot; the Lambda optionally fetches the parent thread message for incident context, calls Bedrock Knowledge Base retrieve_and_generate over S3 Vectors with Nova Lite, rebuilds the Sources citations from each result's S3 key, and posts the answer in-thread.">
  <defs>
    <style><![CDATA[
      .actor    { font: 700 13px -apple-system, "Segoe UI", Inter, Roboto, sans-serif; fill: #ffffff; }
      .lbl      { font: 600 13px -apple-system, "Segoe UI", Inter, Roboto, sans-serif; fill: #0f172a; }
      .msg      { font: 500 12.5px -apple-system, "Segoe UI", Inter, Roboto, sans-serif; fill: #0f172a; }
      .self     { font: 500 12.5px -apple-system, "Segoe UI", Inter, Roboto, sans-serif; fill: #334155; }
      .num      { font: 700 12px -apple-system, "Segoe UI", Inter, Roboto, sans-serif; fill: #047857; }
      .opt      { font: 700 11px -apple-system, "Segoe UI", Inter, Roboto, sans-serif; fill: #b45309; letter-spacing: 0.05em; }
      .lifeline { stroke: #cbd5e1; stroke-width: 1.2; stroke-dasharray: 4 4; }
    ]]></style>
    <marker id="arr"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>

  <rect width="1200" height="640" fill="#ffffff"/>

  <!-- Actor headers -->
  <rect x="20"   y="30" width="180" height="44" rx="8" fill="#4A154B"/>
  <text x="110"  y="58" class="actor" text-anchor="middle">Engineer (Slack)</text>
  <line x1="110" y1="74" x2="110" y2="600" class="lifeline"/>

  <rect x="240"  y="30" width="200" height="44" rx="8" fill="#FF9900"/>
  <text x="340"  y="58" class="actor" text-anchor="middle">Lambda · Query</text>
  <line x1="340" y1="74" x2="340" y2="600" class="lifeline"/>

  <rect x="500"  y="30" width="180" height="44" rx="8" fill="#047857"/>
  <text x="590"  y="58" class="actor" text-anchor="middle">Bedrock KB</text>
  <line x1="590" y1="74" x2="590" y2="600" class="lifeline"/>

  <rect x="740"  y="30" width="180" height="44" rx="8" fill="#6366f1"/>
  <text x="830"  y="58" class="actor" text-anchor="middle">S3 Vectors</text>
  <line x1="830" y1="74" x2="830" y2="600" class="lifeline"/>

  <rect x="980"  y="30" width="200" height="44" rx="8" fill="#047857"/>
  <text x="1080" y="58" class="actor" text-anchor="middle">Nova Lite</text>
  <line x1="1080" y1="74" x2="1080" y2="600" class="lifeline"/>

  <!-- 1. Engineer @mentions bot -->
  <text x="40" y="116" class="num">①</text>
  <line x1="110" y1="128" x2="336" y2="128" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="223" y="116" class="msg" text-anchor="middle">app_mention — free-form question</text>
  <text x="223" y="146" class="self" text-anchor="middle">mention stripped · retries dropped</text>

  <!-- 2. Optional thread-context fetch -->
  <rect x="60" y="176" width="380" height="66" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-dasharray="5 4" stroke-width="1.2"/>
  <text x="74" y="194" class="opt">OPTIONAL — ONLY IF ASKED INSIDE A THREAD</text>
  <text x="40" y="216" class="num">②</text>
  <line x1="340" y1="224" x2="114" y2="224" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="227" y="214" class="msg" text-anchor="middle">conversations.replies · parent message</text>
  <text x="227" y="238" class="self" text-anchor="middle">prepended as incident context</text>

  <!-- 3. Lambda → KB -->
  <text x="270" y="278" class="num">③</text>
  <line x1="340" y1="290" x2="586" y2="290" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="463" y="280" class="msg" text-anchor="middle">retrieve_and_generate · top-5</text>

  <!-- 4. KB → S3 Vectors -->
  <text x="540" y="326" class="num">④</text>
  <line x1="590" y1="338" x2="826" y2="338" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="708" y="328" class="msg" text-anchor="middle">vector search</text>

  <!-- 5. S3 Vectors → KB -->
  <text x="540" y="368" class="num">⑤</text>
  <line x1="830" y1="380" x2="594" y2="380" stroke="#475569" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrR)"/>
  <text x="712" y="370" class="msg" text-anchor="middle" fill="#475569">top-5 past cases</text>

  <!-- 6. KB → Nova -->
  <text x="780" y="418" class="num">⑥</text>
  <line x1="590" y1="430" x2="1076" y2="430" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="833" y="420" class="msg" text-anchor="middle">prompt · retrieved-only · temp 0 · ≤ 5 bullets</text>

  <!-- 7. Nova → Lambda -->
  <text x="270" y="466" class="num">⑦</text>
  <line x1="1080" y1="478" x2="344" y2="478" stroke="#475569" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrR)"/>
  <text x="712" y="468" class="msg" text-anchor="middle" fill="#475569">grounded answer + citations</text>

  <!-- 8. Lambda self: rebuild sources -->
  <text x="272" y="512" class="num">⑧</text>
  <path d="M 340 524 L 410 524 L 410 550 L 344 550" fill="none" stroke="#0f172a" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="418" y="532" class="self">rebuild Sources from each citation's S3 key</text>
  <text x="418" y="548" class="self">cases/{channel}/{thread_ts}.json → permalink · model text untrusted</text>

  <!-- 9. Lambda → Slack -->
  <text x="40" y="580" class="num">⑨</text>
  <line x1="340" y1="592" x2="114" y2="592" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="227" y="582" class="msg" text-anchor="middle">chat.postMessage · in-thread</text>

  <!-- caption -->
  <text x="600" y="624" class="lbl" text-anchor="middle" fill="#475569">No retrieval hit → no answer: the bot says it found no precedent rather than guessing · every claim carries a clickable source</text>
</svg>
