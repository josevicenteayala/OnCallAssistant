<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 760" role="img" aria-label="Flow A — Ingestion: every Slack message is appended to a per-thread audit document in the S3 events prefix. Only when a reply carries a resolution signal does the Lambda run Bedrock extraction with redaction and a confidence gate, write a structured case to the cases prefix, and trigger a Knowledge Base sync that embeds it via Titan into S3 Vectors.">
  <defs>
    <style><![CDATA[
      .actor   { font: 700 13px -apple-system, "Segoe UI", Inter, Roboto, sans-serif; fill: #ffffff; }
      .lbl     { font: 600 13px -apple-system, "Segoe UI", Inter, Roboto, sans-serif; fill: #0f172a; }
      .msg     { font: 500 12.5px -apple-system, "Segoe UI", Inter, Roboto, sans-serif; fill: #0f172a; }
      .self    { font: 500 12.5px -apple-system, "Segoe UI", Inter, Roboto, sans-serif; fill: #334155; }
      .num     { font: 700 12px -apple-system, "Segoe UI", Inter, Roboto, sans-serif; fill: #2563eb; }
      .cond    { font: 700 11.5px -apple-system, "Segoe UI", Inter, Roboto, sans-serif; fill: #b45309; letter-spacing: 0.06em; }
      .gate    { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #b45309; }
      .lifeline{ stroke: #cbd5e1; stroke-width: 1.2; stroke-dasharray: 4 4; }
    ]]></style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>

  <rect width="1320" height="760" fill="#ffffff"/>

  <!-- Conditional band: everything inside runs only on a resolution signal -->
  <rect x="34" y="286" width="1252" height="292" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-dasharray="6 4" stroke-width="1.4"/>
  <text x="50" y="308" class="cond">ONLY WHEN A THREADED REPLY CARRIES A RESOLUTION SIGNAL</text>
  <text x="50" y="326" class="self" fill="#b45309">resolved · fixed · mitigation · recovery · restored · mitigated   (root messages are always "alert")</text>

  <!-- Actor headers -->
  <rect x="20"   y="30" width="160" height="44" rx="8" fill="#4A154B"/>
  <text x="100"  y="58" class="actor" text-anchor="middle">Slack</text>
  <line x1="100" y1="74" x2="100" y2="700" class="lifeline"/>

  <rect x="200"  y="30" width="160" height="44" rx="8" fill="#FF9900"/>
  <text x="280"  y="58" class="actor" text-anchor="middle">Lambda · Ingest</text>
  <line x1="280" y1="74" x2="280" y2="700" class="lifeline"/>

  <rect x="380"  y="30" width="160" height="44" rx="8" fill="#047857"/>
  <text x="460"  y="52" class="actor" text-anchor="middle">Bedrock</text>
  <text x="460"  y="68" class="actor" text-anchor="middle" style="font-size:11px">Nova · extract</text>
  <line x1="460" y1="74" x2="460" y2="700" class="lifeline"/>

  <rect x="560"  y="30" width="160" height="44" rx="8" fill="#6366f1"/>
  <text x="640"  y="58" class="actor" text-anchor="middle">Amazon S3</text>
  <line x1="640" y1="74" x2="640" y2="700" class="lifeline"/>

  <rect x="740"  y="30" width="160" height="44" rx="8" fill="#047857"/>
  <text x="820"  y="58" class="actor" text-anchor="middle">Bedrock KB</text>
  <line x1="820" y1="74" x2="820" y2="700" class="lifeline"/>

  <rect x="920"  y="30" width="160" height="44" rx="8" fill="#047857"/>
  <text x="1000" y="58" class="actor" text-anchor="middle">Titan V2</text>
  <line x1="1000" y1="74" x2="1000" y2="700" class="lifeline"/>

  <rect x="1100" y="30" width="180" height="44" rx="8" fill="#6366f1"/>
  <text x="1190" y="58" class="actor" text-anchor="middle">S3 Vectors</text>
  <line x1="1190" y1="74" x2="1190" y2="700" class="lifeline"/>

  <!-- 1. Slack → Lambda -->
  <text x="40"  y="118" class="num">①</text>
  <line x1="100" y1="130" x2="276" y2="130" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="188" y="120" class="msg" text-anchor="middle">message.channels event</text>
  <text x="188" y="146" class="self" text-anchor="middle">retry deliveries dropped</text>

  <!-- 2. Lambda self: append + classify -->
  <text x="212" y="186" class="num">②</text>
  <path d="M 280 198 L 350 198 L 350 224 L 284 224" fill="none" stroke="#0f172a" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="358" y="206" class="self">append to thread timeline · key = thread_ts</text>
  <text x="358" y="222" class="self">classify role: alert / investigation / action / resolution</text>

  <!-- 3. Lambda → S3 events/ -->
  <text x="212" y="252" class="num">③</text>
  <line x1="280" y1="264" x2="636" y2="264" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="458" y="254" class="msg" text-anchor="middle">PutObject · events/{channel}/{thread_ts}.json — raw audit trail, never indexed</text>

  <!-- 4. Lambda → Bedrock extract -->
  <text x="392" y="352" class="num">④</text>
  <line x1="280" y1="364" x2="456" y2="364" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="368" y="354" class="msg" text-anchor="middle">Converse · whole thread</text>
  <text x="368" y="380" class="self" text-anchor="middle">shared extraction prompt · temp 0</text>

  <!-- 5. Bedrock → Lambda (return) -->
  <text x="392" y="416" class="num">⑤</text>
  <line x1="460" y1="428" x2="284" y2="428" stroke="#475569" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrR)"/>
  <text x="372" y="418" class="msg" text-anchor="middle" fill="#475569">structured case JSON</text>
  <text x="372" y="444" class="self" text-anchor="middle">secrets/PII redacted · confidence scored</text>

  <!-- 6. Lambda self: gate -->
  <text x="212" y="478" class="num">⑥</text>
  <path d="M 280 490 L 350 490 L 350 512 L 284 512" fill="none" stroke="#b45309" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="358" y="500" class="gate">gate: is_resolved &amp;&amp; confidence &gt;= 0.4</text>
  <text x="358" y="516" class="self" fill="#b45309">below the bar → logged and dropped, nothing indexed</text>

  <!-- 7. Lambda → S3 cases/ -->
  <text x="212" y="542" class="num">⑦</text>
  <line x1="280" y1="554" x2="636" y2="554" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="458" y="544" class="msg" text-anchor="middle">PutObject · cases/{channel}/{thread_ts}.json — the only indexed prefix</text>

  <!-- 8. Lambda → KB sync -->
  <text x="212" y="608" class="num">⑧</text>
  <line x1="280" y1="620" x2="816" y2="620" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="548" y="610" class="msg" text-anchor="middle">start_ingestion_job — fires only on a case write, not on every message</text>

  <!-- 9. KB → S3 read -->
  <text x="760" y="652" class="num">⑨</text>
  <line x1="820" y1="664" x2="644" y2="664" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="732" y="654" class="msg" text-anchor="middle">read cases/ · chunk</text>

  <!-- 10. KB → Titan -->
  <text x="940" y="652" class="num">⑩</text>
  <line x1="820" y1="694" x2="996" y2="694" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="908" y="684" class="msg" text-anchor="middle">embed · 1024-dim</text>

  <!-- 11. Titan → S3 Vectors -->
  <text x="1120" y="652" class="num">⑪</text>
  <line x1="1000" y1="724" x2="1186" y2="724" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="1093" y="714" class="msg" text-anchor="middle">upsert · cosine index</text>

  <!-- Caption -->
  <text x="660" y="752" class="lbl" text-anchor="middle" fill="#475569">Same key per thread → re-resolving a thread refreshes its one case · backfill (make upload) writes the identical layout</text>
</svg>
